<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" charset="utf-8">
        <title>Projects - Charles Martin's Portfolio</title>
        <link rel="stylesheet" type="text/css" href="../../../css/style.css">
        <link rel="stylesheet" type="text/css" href="../../../css/app.css">
        <link rel="stylesheet" type="text/css" href="../../../css/catalog.css">
        <link href="https://cdn.metroui.org.ua/4.5.12/icons.css" rel="stylesheet">
        <script src="../../../js/jsonutils.js"></script>
        <script src="../../../js/months.js"></script>
        <script src="../../../js/app-scroll.js" defer></script>
        <script src="../../../js/catalog.js" defer type="module"></script>
    </head>
    <body class="catalog-app" data-catalog data-catalog-data="../../../json/projects.json" data-catalog-link="project.html?id={id}">
        <header>
            <div class="header-wrapper">
                <div class="header-left">
                    <h1>Projects</h1>
                </div>
                <div class="header-right">
                    <a href="../../index.html" class="home-button button-circle button-icon">
                        <span class="mif-home mif-2x"></span>
                    </a>
                </div>
            </div>
            
            <p class="app-kicker">PORTFOLIO / WORK</p>
            <p class="app-subtitle">A collection of experiments, applications, and finished work.</p>
            <nav class="catalog-command" aria-label="Project sorting">
                <button class="is-selected" type="button" data-sort="date-desc">Newest first</button>
                <button type="button" data-sort="date-asc">Oldest first</button>
                <button type="button" data-sort="category">By category</button>
            </nav>
        </header>
        <main>
            <div class="grid" id="catalog-grid">
                <section class="category">
                </section>
            </div>
        </main>
        <footer>

        </footer>
    </body>
</html>
